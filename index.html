<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZoubirNasriShop — متجر إلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: true } };
</script>
<style>
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FFF1E1;
  --ink:#241539; --muted:#78698A; --line:#F1E1CE;
  --brand:#FF6A00; --brand-soft:#FFE7CC; --brand-ink:#C74E00;
  --accent:#8B2FE0; --accent-soft:#F1E3FC; --accent-ink:#6B1FB0;
  --gold:#FFB800; --gold-soft:#FFF2CC;
  --grad:linear-gradient(135deg,var(--brand),var(--accent));
  --shadow:0 1px 2px rgba(36,21,57,.07), 0 10px 26px -12px rgba(36,21,57,.22);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181022; --surface:#231732; --surface-2:#2C1F40;
    --ink:#F6EFFF; --muted:#B6A6CC; --line:#392B4D;
    --brand:#FF8A3D; --brand-soft:#3A2412; --brand-ink:#FFB37A;
    --accent:#B98CFF; --accent-soft:#2C2145; --accent-ink:#D8C2FF;
    --gold:#FFCB4D; --gold-soft:#3A2E0E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#181022; --surface:#231732; --surface-2:#2C1F40;
  --ink:#F6EFFF; --muted:#B6A6CC; --line:#392B4D;
  --brand:#FF8A3D; --brand-soft:#3A2412; --brand-ink:#FFB37A;
  --accent:#B98CFF; --accent-soft:#2C2145; --accent-ink:#D8C2FF;
  --gold:#FFCB4D; --gold-soft:#3A2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Cairo","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.65; overflow-x:hidden;
}
html[dir="ltr"] body{font-family:"Outfit","Cairo",system-ui,sans-serif}
h1,h2,h3{line-height:1.25; margin:0; font-weight:800; letter-spacing:-.01em}
img{max-width:100%; display:block}
button,input,select,textarea{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px; border-radius:6px}
::selection{background:var(--brand); color:#fff}

/* ---------- shared bits ---------- */
.wrap{width:100%; max-width:1180px; margin-inline:auto; padding-inline:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent;
  border-radius:999px; padding:11px 20px; font-weight:700; cursor:pointer; background:var(--surface-2); color:var(--ink);
  transition:transform .12s ease, background .18s ease, box-shadow .18s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand); color:#fff; box-shadow:0 6px 18px -8px var(--brand)}
.btn-primary:hover{background:var(--brand-ink)}
.btn-accent{background:var(--accent); color:#fff; box-shadow:0 8px 22px -10px var(--accent)}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-sm{padding:7px 14px; font-size:.85rem}
.field{width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px;
  transition:border-color .15s ease, box-shadow .15s ease}
.field:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); outline:none}
label.lbl{display:block; font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:6px}
.price{font-family:"Outfit","Cairo",sans-serif; font-weight:800; font-variant-numeric:tabular-nums}
.badge{display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); color:var(--brand-ink);
  border-radius:999px; padding:4px 12px; font-size:.78rem; font-weight:700}
.badge-accent{background:var(--accent-soft); color:var(--accent)}
.hidden{display:none !important}

/* ---------- orders dashboard: stats & filters ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.stat-card{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:16px 18px 14px; box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease}
.stat-card:hover{transform:translateY(-3px); box-shadow:0 16px 32px -16px rgba(15,31,27,.28)}
.stat-card::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px;
  background:var(--stat-c, var(--brand))}
.stat-icon{font-size:1.25rem; line-height:1; display:block; margin-bottom:10px}
.stat-label{font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:4px}
.stat-value{font-family:"Outfit","Cairo",sans-serif; font-weight:900; font-size:1.55rem;
  color:var(--stat-c, var(--ink))}
.filter-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface);
  border:1px solid var(--line); border-radius:18px; padding:12px 14px; margin-bottom:16px; box-shadow:var(--shadow)}
.seg{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px}
.seg button{border:none; background:transparent; padding:8px 16px; border-radius:999px; font-weight:700;
  font-size:.85rem; cursor:pointer; color:var(--muted); transition:background .15s ease, color .15s ease}
.seg button.on{background:var(--brand); color:#fff; box-shadow:0 4px 12px -4px var(--brand)}
.filter-bar input[type="date"]{background:var(--surface); border:1.5px solid var(--line); border-radius:12px;
  padding:8px 10px; font-size:.85rem; color:var(--ink)}
.status-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
  font-size:.78rem; font-weight:800}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.muted{color:var(--muted)}

/* ---------- header ---------- */
header.topbar{position:relative; position:sticky; top:env(safe-area-inset-top, 0px); z-index:50;
  background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
header.topbar::after{content:""; position:absolute; inset-inline:0; bottom:-2px; height:2px; background:var(--grad)}
.logo{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.logo-mark{width:38px; height:38px; border-radius:12px; background:var(--grad);
  color:#fff; display:grid; place-items:center; font-family:"Outfit",sans-serif; font-weight:800; font-size:1.05rem;
  box-shadow:0 6px 16px -6px var(--brand)}
.logo-txt{font-family:"Outfit",sans-serif; font-weight:800; font-size:1.02rem; letter-spacing:-.02em}
.logo-txt span{color:var(--accent)}
.lang-pill{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px}
.lang-pill button{border:0; background:transparent; border-radius:999px; padding:5px 11px; font-size:.78rem; font-weight:700;
  cursor:pointer; color:var(--muted)}
.lang-pill button[aria-pressed="true"]{background:var(--surface); color:var(--brand); box-shadow:var(--shadow)}

/* ---------- hero ---------- */
.hero{position:relative; border-radius:28px; overflow:hidden; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow)}
.hero-grid{display:grid; grid-template-columns:1fr; gap:0}
@media(min-width:820px){ .hero-grid{grid-template-columns:1.05fr .95fr} }
.hero-media{position:relative; background:var(--surface-2); aspect-ratio:4/3; overflow:hidden}
.hero-media img{width:100%; height:100%; object-fit:cover}
.hero-body{padding:26px 22px 28px; display:flex; flex-direction:column; justify-content:center; gap:14px}
@media(min-width:820px){ .hero-body{padding:40px 38px} .hero-media{aspect-ratio:auto; min-height:420px} }
.hero-title{font-size:clamp(1.55rem,4.6vw,2.5rem)}
.strike{color:var(--muted); text-decoration:line-through; font-weight:600}

/* ---------- product grid ---------- */
.grid-products{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
@media(min-width:680px){ .grid-products{grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px} }
@media(min-width:1000px){ .grid-products{grid-template-columns:repeat(4,minmax(0,1fr))} }
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
.pcard:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.pcard-media{position:relative; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden}
.pcard-media img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.pcard:hover .pcard-media img{transform:scale(1.07)}
.pcard-body{padding:11px 13px 14px; display:flex; flex-direction:column; gap:6px; flex:1}
.pcard-name{font-weight:700; font-size:.95rem; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ribbon{position:absolute; inset-inline-start:10px; top:10px; z-index:2}

/* ---------- product landing ---------- */
.gallery{display:flex; flex-direction:column; gap:14px}
.gimg{width:100%; border-radius:22px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.gimg img{width:100%; height:auto; object-fit:contain; cursor:zoom-in; transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.gimg.zoomed img{transform:scale(1.9); cursor:zoom-out}
.desc-html{line-height:1.9; max-width:100%; overflow-wrap:anywhere}
.desc-html img{max-width:100%; height:auto; border-radius:16px; margin:12px auto; display:block}
.desc-html h2,.desc-html h3{margin:18px 0 8px; font-size:1.15rem}
.desc-html ul{padding-inline-start:22px; margin:10px 0}
.desc-html li{margin:5px 0}
.desc-html p{margin:10px 0}
.desc-html table{border-collapse:collapse; width:100%; min-width:0}
.desc-html td,.desc-html th{border:1px solid var(--line); padding:7px 10px; font-size:.9rem}
.desc-html .tbl-wrap{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
.desc-html iframe,.desc-html video{max-width:100%; width:100%; aspect-ratio:16/9; border:0; border-radius:16px}
.desc-html pre{max-width:100%; overflow-x:auto}
.desc-html *{max-width:100%}

/* description content comes from admin-pasted HTML that may ship its own
   full page (<style>, fixed widths, <div id="root">…). Rendering it inline
   let that CSS leak onto the whole storefront and break the layout on every
   screen size — see the isolated-frame fix in mountDescFrame(). The frame
   itself is width:100% and its height is measured and re-applied from JS so
   it always matches its content, on phone and desktop alike. */
.desc-frame-wrap{width:100%; max-width:100%; overflow:hidden}
.desc-frame{display:block; width:100%; border:0; background:transparent; min-height:60px}

/* ---------- category filter ---------- */
.cat-bar{display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 2px 10px}
.cat-pill{display:flex; align-items:center; gap:7px; white-space:nowrap; flex:0 0 auto; cursor:pointer;
  border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 16px;
  font-weight:700; font-size:.86rem; color:var(--ink); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.cat-pill:hover{transform:translateY(-2px)}
.cat-pill .ic{font-size:1.05rem; line-height:1}
.cat-pill[data-on="1"]{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 18px -8px var(--brand)}
.order-box{position:relative}
@media(min-width:960px){
  .pdp{display:grid; grid-template-columns:1.15fr .85fr; gap:30px; align-items:start}
  .order-box{position:sticky; top:96px}
}
.radio-card{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:16px; padding:12px 14px;
  cursor:pointer; background:var(--surface); flex:1; transition:border-color .15s, background .15s}
.radio-card[data-on="1"]{border-color:var(--brand); background:var(--brand-soft)}
.qty{display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:999px; overflow:hidden; width:fit-content}
.qty button{width:40px; height:40px; border:0; background:var(--surface-2); font-size:1.1rem; font-weight:800; cursor:pointer}
.qty span{min-width:48px; text-align:center; font-weight:800}

/* ---------- floating contact ---------- */
.floaties{position:fixed; inset-inline-end:14px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:60;
  display:flex; flex-direction:column; gap:10px}
.fab{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#fff; box-shadow:0 10px 26px -8px rgba(0,0,0,.45);
  border:0; cursor:pointer; transition:transform .15s ease}
.fab:hover{transform:translateY(-2px) scale(1.05)}
.fab-wa{background:#25D366}
.fab-fb{background:#1877F2}

/* ---------- admin ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.tabs button{white-space:nowrap; border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:8px 16px; font-weight:700; font-size:.88rem; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand); color:#fff; border-color:var(--brand)}
table.tbl{width:100%; border-collapse:collapse; font-size:.88rem; min-width:720px}
table.tbl th{text-align:start; font-size:.76rem; color:var(--muted); font-weight:700; padding:10px; border-bottom:1px solid var(--line)}
table.tbl td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
table.tbl tr:hover td{background:var(--surface-2)}
.toast{position:fixed; inset-inline:0; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:200;
  display:flex; justify-content:center; pointer-events:none}
.toast>div{background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-weight:700; font-size:.9rem;
  box-shadow:var(--shadow); max-width:90vw}
.modal{position:fixed; inset:0; z-index:150; background:rgba(8,16,14,.55); display:grid; place-items:center; padding:16px;
  backdrop-filter:blur(3px)}
.modal-panel{background:var(--surface); border-radius:24px; width:100%; max-width:640px; max-height:88vh; overflow:auto;
  border:1px solid var(--line); box-shadow:var(--shadow)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2)); background-size:200% 100%;
  animation:sh 1.3s infinite; border-radius:16px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
.trust{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(min-width:760px){ .trust{grid-template-columns:repeat(4,1fr)} }
.trust>div{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:12px 14px; font-size:.86rem; font-weight:700}
footer.site{background:var(--surface); border-top:1px solid var(--line); margin-top:56px;
  padding:34px 0 calc(90px + env(safe-area-inset-bottom,0px))}
</style>

<body>

<header class="topbar">
  <div class="wrap" style="display:flex; align-items:center; gap:12px; height:66px">
    <div class="logo" onclick="go('home')">
      <div class="logo-mark">ZN</div>
      <div>
        <div class="logo-txt">Zoubir<span>Nasri</span>Shop</div>
        <div class="muted" style="font-size:.68rem; margin-top:-4px" id="tagline">الدفع عند الاستلام · 58 ولاية</div>
      </div>
    </div>
    <div style="flex:1"></div>
    <div class="lang-pill" id="langPill">
      <button data-lang="ar" aria-pressed="true">ع</button>
      <button data-lang="fr" aria-pressed="false">FR</button>

/* Firestore adapter — same tiny interface the rest of the app already uses. */
function fbAdapter(){
  const F=window.FB;
  const mkDoc = p => ({
    get:    async()=>{ const s=await F.getDoc(F.docRef(p)); return {id:s.id, exists:s.exists(), data:()=>s.data()}; },
    set:    d=>F.setDoc(F.docRef(p), d),
    update: d=>F.updateDoc(F.docRef(p), d),
    delete: ()=>F.deleteDoc(F.docRef(p))
  });
  const mkQ = (p, cs=[]) => ({
    orderBy:(f,d)=>mkQ(p,[...cs,F.orderBy(f,d||'asc')]),
    limit:n=>mkQ(p,[...cs,F.limit(n)]),
    doc:id=>mkDoc(p+'/'+id),
    get:async()=>{ const s=await F.getDocs(F.query(F.colRef(p),...cs));
      return {docs:s.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()}))}; },
    onSnapshot:(cb,err)=>F.onSnapshot(F.query(F.colRef(p),...cs),
      s=>cb({docs:s.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()}))}), err)
  });
  return { doc:mkDoc, collection:mkQ };
}

function makeSampler(key){
  return async (prompt)=>{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":key,
                "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1200,
                             messages:[{role:"user", content:prompt}] })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error.message);
    return { text: d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n") };
  };
}

/* ---- new-order alerts (sound + vibration + system notification) ----
   Works while the admin is logged in on the device and the page is open
   (screen kept awake via Wake Lock). For alerts when the app is CLOSED, use

const Alert = { ctx:null, seen:null, wake:null, unread:0, title:document.title };
const alertOn = () => !!LS.get('alert', false);
function unlockAudio(){
  try{
    Alert.ctx = Alert.ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(Alert.ctx.state==='suspended') Alert.ctx.resume();
  }catch(e){}
}
function playChime(times=3){
  try{
    unlockAudio(); const c=Alert.ctx; if(!c) return;
    for(let r=0;r<times;r++){
      const base=c.currentTime + r*1.15;
      [[880,0],[1175,.16],[1568,.32],[1175,.6],[1568,.76]].forEach(([f,d])=>{
        const o=c.createOscillator(), g=c.createGain();
        o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,base+d);
        g.gain.linearRampToValueAtTime(.55,base+d+.02);
        g.gain.exponentialRampToValueAtTime(.001,base+d+.45);
        o.connect(g); g.connect(c.destination); o.start(base+d); o.stop(base+d+.5);
      });
    }
  }catch(e){}
}
async function requestWake(){
  try{ if('wakeLock' in navigator && !Alert.wake){
    Alert.wake = await navigator.wakeLock.request('screen');
    Alert.wake.addEventListener('release',()=>{ Alert.wake=null; });
  } }catch(e){}
}
function releaseWake(){ try{ Alert.wake && Alert.wake.release(); }catch(e){} Alert.wake=null; }

  const fresh = S.orders.filter(o=>!Alert.seen.has(o.id) && o.status==='pending');
  Alert.seen = ids;
  if(!fresh.length || !S.admin || !alertOn()) return;
  playChime();
  try{ navigator.vibrate && navigator.vibrate([300,120,300,120,500]); }catch(e){}
  const o = fresh[0];

}

/* ---- lifetime order counters (survive delete/archive — see DEFAULT_SETTINGS.stats) ---- */
function ensureStats(){
  if(!S.settings.stats) S.settings.stats = {count:0,pending:0,confirmed:0,shipped:0,done:0,cancelled:0,revenue:0};
  return S.settings.stats;
}
function bumpStatsOnCreate(o){
  const s = ensureStats();
  s.count = (s.count||0)+1;
  s.pending = (s.pending||0)+1;
  s.revenue = (s.revenue||0) + (Number(o.total)||0);
}
function bumpStatsOnStatusChange(oldStatus, newStatus, total){
  if(oldStatus===newStatus) return;
  const s = ensureStats();
  if(oldStatus && s[oldStatus]!=null) s[oldStatus]=Math.max(0,(s[oldStatus]||0)-1);
  if(newStatus) s[newStatus]=(s[newStatus]||0)+1;
  const wasCancelled=oldStatus==='cancelled', isCancelled=newStatus==='cancelled';
  if(wasCancelled && !isCancelled) s.revenue=(s.revenue||0)+(Number(total)||0);
  else if(!wasCancelled && isCancelled) s.revenue=(s.revenue||0)-(Number(total)||0);
}
/* Manual, explicit reset of the lifetime counters only — never touches
   S.orders, so today's live order list/table is completely unaffected. */
async function resetStats(){
  if(!confirm('سيتم تصفير كل عدادات لوحة التحكم (الطلبات، الحالات، المجموع الكلي) إلى 0. هذا لا يحذف أي طلبية ولا يمكن التراجع عنه بعد التأكيد. متابعة؟')) return;
  S.settings.stats = {count:0,pending:0,confirmed:0,shipped:0,done:0,cancelled:0,revenue:0};
  await saveSettings();
  render();
  toast('✅ تم تصفير العداد');
}
async function addOrder(o){
  o.createdAt = new Date().toISOString();

  o.ref = id;

  if(sheetUrl){ pushSheet([{id, ...o}]); o.sheetSynced = true; } // remembers it's already in the sheet, so archiving never re-sends it
  bumpStatsOnCreate(o); await saveSettings();
  if(DB){

    catch(e){ toast("⚠︎ "+(e.code||e.message)); }

/* ---------------------------------------------------------------------------
   Isolated, auto-sizing product description.
   Admin-pasted descriptions sometimes arrive as a full HTML page (their own
   <style>, fixed pixel widths, a wrapping <div id="root">…). Injecting that
   straight into the storefront's DOM makes its CSS apply globally — that is
   exactly why formatting used to break on both phone and desktop at once.
   Loading it inside a sandboxed iframe keeps its markup/CSS fully contained,
   then this code measures the frame's real content height (after layout AND
   after every image finishes loading) and applies it to the frame element,
   so the frame is never scrollable and always matches its content — on any
   screen size, automatically. ------------------------------------------- */
function mountDescFrame(){
  const ifr = document.getElementById('descFrame'); if(!ifr) return;
  const p = byId(S.productId); if(!p) return;
  const html = L(p.desc) || `<p style="color:#9a8fae">${esc(t('noProducts'))}</p>`;
  const cs = getComputedStyle(document.documentElement);
  const v = name => (cs.getPropertyValue(name)||'').trim();
  const dir = document.documentElement.dir || 'rtl';
  const doc = `<!doctype html><html dir="${dir}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; padding:0}
body{font-family:"Cairo","Outfit",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.9;
  color:${v('--ink')||'#241539'}; background:transparent; overflow-x:hidden; word-wrap:break-word; overflow-wrap:anywhere}
img,video{max-width:100% !important; width:auto; height:auto !important; display:block; margin:12px auto; border-radius:16px}
iframe{max-width:100% !important; width:100%; aspect-ratio:16/9; border:0; border-radius:16px}
h1,h2,h3,h4{line-height:1.3; margin:18px 0 8px; font-weight:800}
p{margin:10px 0}
ul,ol{padding-inline-start:22px; margin:10px 0}
li{margin:5px 0}
a{color:${v('--brand-ink')||'#C74E00'}}
table{border-collapse:collapse; max-width:100%; width:100%}
td,th{border:1px solid ${v('--line')||'#F1E1CE'}; padding:7px 10px; font-size:.9rem}
.tbl-wrap{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
pre{max-width:100%; overflow-x:auto}
*{max-width:100%}
</style></head><body>${html}</body></html>`;
  ifr.srcdoc = doc;
  ifr.onload = () => {
    let cdoc; try{ cdoc = ifr.contentDocument; }catch(e){ return; }
    if(!cdoc) return;
    cdoc.querySelectorAll('table').forEach(tb=>{
      if(tb.parentElement && tb.parentElement.classList.contains('tbl-wrap')) return;
      const wrap=cdoc.createElement('div'); wrap.className='tbl-wrap';
      tb.parentNode.insertBefore(wrap, tb); wrap.appendChild(tb);
    });
    const resize = () => {
      if(ifr.isConnected===false) return;
      const h = Math.max(cdoc.documentElement.scrollHeight, cdoc.body.scrollHeight);
      ifr.style.height = (h+4)+'px';
    };
    resize();
    try{ new ResizeObserver(resize).observe(cdoc.body); }catch(e){}
    cdoc.querySelectorAll('img').forEach(img=>{
      if(!img.complete) img.addEventListener('load', resize);
      img.addEventListener('error', resize);
    });
    window.addEventListener('resize', resize);
  };
}

let QTY=1;
function bumpQty(n){ QTY=Math.max(1,Math.min(99,QTY+n)); document.getElementById('f_qty').textContent=QTY; recalc(); }
function wireOrderForm(){
  QTY=1;
  const w=document.getElementById('f_wilaya'); if(!w) return;
  w.addEventListener('change',()=>{
    const wc=w.value, sel=document.getElementById('f_commune');
    const row=DZ.find(x=>String(x[0])===String(wc));
    sel.innerHTML=`<option value="">${t('pickCommune')}</option>`+
      (row?row[3].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join(''):'')+
      `<option value="__other">${t('other')}</option>`;
    document.getElementById('f_commune_other').classList.add('hidden');
    recalc();
  });
  document.getElementById('f_commune').addEventListener('change',e=>{
    document.getElementById('f_commune_other').classList.toggle('hidden', e.target.value!=='__other');
  });
  document.querySelectorAll('input[name="dtype"]').forEach(r=>r.addEventListener('change',()=>{
    document.getElementById('rc_home').dataset.on = r.form.dtype.value==='home'?'1':'';
    document.getElementById('rc_desk').dataset.on = r.form.dtype.value==='desk'?'1':'';
    recalc();
  }));
  recalc();
}
function recalc(){
  const p=byId(S.productId); if(!p) return;
  const wc=document.getElementById('f_wilaya')?.value;
  const type=document.querySelector('input[name="dtype"]:checked')?.value||'home';
  const h=document.getElementById('p_home'), dk=document.getElementById('p_desk');
  if(wc){ h.textContent=money(shipFor(wc,'home')); dk.textContent=money(shipFor(wc,'desk')); }
  else { h.textContent='—'; dk.textContent='—'; }
  const sub=p.price*QTY, ship=wc?shipFor(wc,type):0;
  document.getElementById('s_sub').textContent=money(sub);
  document.getElementById('s_ship').textContent=wc?money(ship):'—';
  document.getElementById('s_total').textContent=money(sub+ship);
}
async function submitOrder(pid){
  const p=byId(pid); if(!p) return;
  const g=id=>document.getElementById(id)?.value.trim()||'';
  let commune=g('f_commune'); if(commune==='__other') commune=g('f_commune_other');
  const phone=g('f_phone').replace(/\s|-/g,'');
  const wc=g('f_wilaya');
  if(!g('f_name')||!phone||!wc||!commune||!g('f_addr')) return toast(t('required'));
  if(!/^0?[5-7]\d{8}$/.test(phone)) return toast(t('badPhone'));
  const type=document.querySelector('input[name="dtype"]:checked')?.value||'home';
  const row=DZ.find(x=>String(x[0])===String(wc));
  const ship=shipFor(wc,type), sub=p.price*QTY;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> ${t('sending')}`;
  const order=await addOrder({
    productId:p.id, productName:L(p.name), unitPrice:p.price, qty:QTY,
    customer:g('f_name'), phone, phone2:g('f_phone2'),
    wilayaCode:Number(wc), wilaya:row?row[2]:'', wilayaAr:row?row[1]:'',
    commune, address:g('f_addr'), notes:g('f_notes'),
    deliveryType:type, shipping:ship, subtotal:sub, total:sub+ship, lang:LANG
  });
  S.lastOrder=order;
  trackPurchase(order);
  go('success');
}

async function moveProduct(id, dir){
  const sid = S.editStore || STORE_ID;
  const ids = sortByLayout(S.products, sid).map(p=>p.id);
  const i = ids.indexOf(id); if(i<0) return;
  const j = dir==='top' ? 0 : i+dir;
  if(j<0 || j>=ids.length) return;
  ids.splice(i,1); ids.splice(j,0,id);
  S.layouts[sid] = {...layoutOf(sid), order:ids};
  render();
  if(await saveLayout(sid)) toast(t('saved'));

function imgChips(){

     fully visible inside it (object-fit:contain + neutral background) instead
     of being cropped/stretched to fill a square — so any portrait, landscape
     or square product photo adapts cleanly to the same designated slot. */
  return (DRAFT.images||[]).map((src,i)=>`<div style="position:relative">
    <div style="width:76px;height:76px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
      overflow:hidden; display:flex; align-items:center; justify-content:center">

function cloudinaryReady(){
  const c=window.CLOUDINARY||{};
  return c.CLOUD_NAME && c.UPLOAD_PRESET && !c.CLOUD_NAME.includes('PASTE');
}
/** Uploads one file to Cloudinary (unsigned) and returns a permanent, light-weight URL —
 *  nothing but that short URL string is ever stored in Firestore. */
async function uploadToCloudinary(file){
  const c=window.CLOUDINARY;
  const fd=new FormData();
  fd.append('file', file);
  fd.append('upload_preset', c.UPLOAD_PRESET);
  fd.append('folder', 'zoubirnasrishop');
  const res=await fetch(`https://api.cloudinary.com/v1_1/${c.CLOUD_NAME}/image/upload`, {method:'POST', body:fd});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message);
  // f_auto,q_auto: Cloudinary serves an optimized, auto-compressed format to each visitor
  return data.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_1200/');
}
async function uploadImgs(input){
  const useCloud = cloudinaryReady();
  const bar=document.getElementById('d_imgs');
  for(const file of input.files){
    const tempId = 'up_'+Math.random().toString(36).slice(2);
    bar.insertAdjacentHTML('beforeend', `<div class="skel" id="${tempId}" style="width:76px;height:76px;border-radius:12px"></div>`);
    try{
      const url = useCloud ? await uploadToCloudinary(file) : await compress(file);
      DRAFT.images.push(url);
      if(!useCloud) toast('⚠︎ Cloudinary غير مُفعّل — تم الحفظ محلياً (أثقل). راجع الإعدادات.');
    }catch(e){
      try{ DRAFT.images.push(await compress(file)); toast('⚠︎ Cloudinary: '+e.message+' — تم الحفظ محلياً بدلاً منه'); }
      catch(_){ toast('⚠︎ فشل رفع الصورة'); }
    }
    document.getElementById(tempId)?.remove();
  }
  input.value=''; document.getElementById('d_imgs').innerHTML=imgChips();
}
function compress(file, max=1000, q=.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=im.width*sc; c.height=im.height*sc;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

function dayStart(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function dayEnd(d){ const x=new Date(d); x.setHours(23,59,59,999); return x; }
function filterOrdersByDate(orders, f){

function ordersTable(sep){
  const head=["ref","date","customer","phone","phone2","wilaya_code","wilaya","commune","address",
    "delivery","product","qty","unit_price","shipping","total","status","notes"];
  const rows=S.orders.map(o=>[o.ref||o.id, o.createdAt, o.customer, o.phone, o.phone2||'',
    o.wilayaCode, o.wilaya, o.commune, (o.address||'').replace(/[\r\n]+/g,' '),
    o.deliveryType==='home'?'Domicile':'Bureau', o.productName, o.qty, o.unitPrice, o.shipping, o.total,
    o.status, (o.notes||'').replace(/[\r\n]+/g,' ')]);
  const q=v=>{ v=String(v==null?'':v); return sep===','? '"'+v.replace(/"/g,'""')+'"' : v; };
  return [head.join(sep), ...rows.map(r=>r.map(q).join(sep))].join('\r\n');
}
async function exportCsv(){
  const csv="\uFEFF"+ordersTable(",");              // UTF-8 BOM → Arabic opens correctly in Excel
  const filename=`ZoubirNasriShop-orders-${new Date().toISOString().slice(0,10)}.csv`;
  if(DOWNLOADS){ try{ await DOWNLOADS.save({filename, data:csv}); return toast('✅ '+t('exportCsv')); }catch(e){} }
  try{ const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=filename; a.click();
  }catch(e){ await navigator.clipboard.writeText(csv); toast(t('copied')); }
}
/* Sends rows to the Google Apps Script web app. `no-cors` means we never
   read the reply — Apps Script does not send CORS headers — but the rows
   do arrive in the sheet. */
function pushSheet(orders){
  const url = S.settings.sheetUrl || window.SHEETS_URL;
  if(!url || !orders?.length) return;
  const rows = orders.map(o=>[o.ref||o.id,
    new Date(o.createdAt).toLocaleString('fr-DZ',{timeZone:'Africa/Algiers'}),
    o.customer, o.phone, o.phone2||'', String(o.wilayaCode).padStart(2,'0'),
    o.wilayaAr||o.wilaya, o.commune, o.address,
    o.deliveryType==='home'?'المنزل':'المكتب',
    o.productName, o.qty, o.unitPrice, o.shipping, o.total, o.status, o.notes||'']);
  fetch(url,{method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:'ZN', rows})}).catch(()=>{});
}
/* Each order is already sent to the sheet once, the moment it's created
   (see pushSheet() call in addOrder, which sets o.sheetSynced) — that's the
   live backup. Archiving only needs to (re-)send orders that were never
   synced — e.g. created before a Sheets link existed, or a push that failed
   — then clear everything out of the store; already-synced orders are only
   deleted here, never re-pushed, so nothing ends up duplicated in the sheet. */
async function archiveSheets(){
  if(!S.orders.length) return toast('لا توجد طلبات لأرشفتها');
  const url = S.settings.sheetUrl || window.SHEETS_URL;
  if(url){
    const notSynced = S.orders.filter(o=>!o.sheetSynced);
    const msg = notSynced.length
      ? `سيتم إرسال ${notSynced.length} طلبية غير مسجّلة بعد إلى Google Sheets، ثم حذف كل الطلبات (${S.orders.length}) من المتجر. هل أنت متأكد؟`
      : `سيتم حذف ${S.orders.length} طلبية من المتجر (هي محفوظة أصلاً في Google Sheets منذ إنشائها). هل أنت متأكد؟`;
    if(!confirm(msg)) return;
    if(notSynced.length) pushSheet(notSynced);
    const ok = await deleteAllOrders();
    if(ok) toast('✅ تم حذف الطلبات من المتجر — نسختها محفوظة في Google Sheets');
    return;
  }
  try{
    await navigator.clipboard.writeText(ordersTable("\t"));
    toast('📋 '+t('copied')+' → الصق الجدول في Google Sheets (Ctrl+V)');
    if(confirm('هل قمت بلصق الجدول في Google Sheets؟ في حال الموافقة، سيتم حذف الطلبات من المتجر.')){
      const ok = await deleteAllOrders();
      if(ok) toast('✅ تم حذف الطلبات من المتجر');
    }
  }catch(e){ toast('⚠︎ '+e.message); }
}
async function deleteAllOrders(){
  const ids = S.orders.map(o=>o.id);
  let failed = 0;
  for(const id of ids){
    const ok = await removeOrder(id);
    if(!ok) failed++;
  }
  if(S.tab==='orders') render();
  if(failed){
    toast(`⚠︎ تعذّر حذف ${failed} من أصل ${ids.length} طلبية — تأكد من نشر صلاحية الحذف (allow delete) في Firestore Rules`);
    return false;
  }
  return true;
}

    <div><label class="lbl">Facebook</label><input class="field" id="st_fb" value="${esc(S.settings.facebook)}"></div>
    <div class="card" style="padding:14px; box-shadow:none; background:var(--surface-2); display:grid; gap:12px">
      <b style="font-size:.85rem">📊 ${t('pixelsTitle')}</b>
      <div><label class="lbl">${t('fbPixel')}</label>
        <input class="field" id="st_fbpx" placeholder="1234567890123456" value="${esc(S.settings.fbPixel||'')}">
        <p class="muted" style="font-size:.76rem; margin:6px 0 0">${t('fbPixelHelp')}</p></div>
      <div><label class="lbl">${t('ttPixel')}</label>
        <input class="field" id="st_ttpx" placeholder="C4A1B2C3D4E5F6G7H8I9" value="${esc(S.settings.ttPixel||'')}">
        <p class="muted" style="font-size:.76rem; margin:6px 0 0">${t('ttPixelHelp')}</p></div>
    </div>
    <div><label class="lbl">${t('sheetUrl')}</label><input class="field" id="st_sheet" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.settings.sheetUrl||'')}">
      <p class="muted" style="font-size:.76rem; margin:6px 0 0">Google Apps Script — يعمل مباشرة في النسخة المستضافة على خادمك (Node/Express). داخل هذه المعاينة يتم نسخ الجدول إلى الحافظة بدل الإرسال.</p></div>
    <div class="card" style="padding:14px; box-shadow:none; background:${alertOn()?'var(--brand-soft)':'var(--surface-2)'}; display:grid; gap:10px">
      <b style="font-size:.85rem">🔔 إشعار صوتي للطلبات الجديدة ${alertOn()?'— مفعّل ✅':'— متوقف'}</b>
      <p class="muted" style="font-size:.78rem; margin:0">رنّة + اهتزاز + إشعار نظام عند وصول طلب جديد، ما دامت لوحة التحكم مفتوحة ومسجَّل الدخول (الشاشة تبقى مضاءة تلقائياً). فعّله على كل جهاز تريد أن يرنّ. للإشعار والتطبيق مغلق: فعّل Telegram في google-apps-script.gs.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn ${alertOn()?'btn-ghost':'btn-primary'}" onclick="toggleAlert()">${alertOn()?'إيقاف الإشعار':'🔔 تفعيل الإشعار الصوتي'}</button>
        <button class="btn btn-ghost" onclick="unlockAudio();playChime(1)">▶︎ تجربة الصوت</button>
      </div>
    </div>
    <div class="card" style="padding:14px; box-shadow:none; background:${cloudinaryReady()?'var(--brand-soft)':'var(--accent-soft)'}">
      <b style="font-size:.85rem">${cloudinaryReady()?'☁︎ Cloudinary متصل — الصور تُخزَّن خارجياً':'⚠︎ Cloudinary غير مُفعّل — الصور تُخزَّن حالياً داخل قاعدة البيانات (أثقل)'}</b>
      <p class="muted" style="font-size:.78rem; margin:6px 0 0">فعّله بتعديل <code>window.CLOUDINARY</code> في أعلى ملف index.html — التفاصيل في README.</p>
    </div>
    <div><label class="lbl">Anthropic API key (مولّد الإعلانات)</label>
      <input class="field" id="st_ai" type="password" placeholder="sk-ant-…" value="${esc(localStorage.getItem('zn_aikey')||'')}">
      <p class="muted" style="font-size:.76rem; margin:6px 0 0">يُحفظ في هذا المتصفح فقط ولا يظهر للزبائن. لا تضعه داخل ملف الموقع أبداً.</p></div>
    <div style="display:flex; gap:10px">
      <button class="btn btn-primary" onclick="commitSettings()">${t('save')}</button>
      <button class="btn btn-ghost" onclick="toggleTheme()">🌓</button>
    </div>
  </div>`;
}
async function commitSettings(){
  const g=i=>document.getElementById(i).value.trim();
  const aik=g('st_ai');
  if(aik){ localStorage.setItem('zn_aikey',aik); SAMPLE=makeSampler(aik); }
  else { localStorage.removeItem('zn_aikey'); SAMPLE=null; }
  Object.assign(S.settings,{storeName:g('st_name'),adminPass:g('st_pass')||S.settings.adminPass,
    whatsapp:g('st_wa'),facebook:g('st_fb'),sheetUrl:g('st_sheet'),
    fbPixel:g('st_fbpx'),ttPixel:g('st_ttpx')});
  await saveSettings(); loadPixels(); toast(t('saved')); render();
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
  localStorage.setItem('zn_theme', document.documentElement.getAttribute('data-theme'));
}
function wireAdmin(){ const p=document.getElementById('a_pass'); if(p) p.focus(); }

/* ------------------------------- 8. Boot -------------------------------- */
document.getElementById('yr').textContent=new Date().getFullYear();
document.getElementById('langPill').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lang]'); if(b) setLang(b.dataset.lang);
});
try{ const th=localStorage.getItem('zn_theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
document.documentElement.lang=LANG; document.documentElement.dir=I18N[LANG].dir;
document.querySelectorAll('#langPill button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===LANG));
document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
document.getElementById('tagline').textContent=t('tagline');
render();
initCloud();
</script>

</body>
</html>
